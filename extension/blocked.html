<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Focus Guard Protection Active | NickOS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { background: #050505; color: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .card { background: #121212; border: 1px solid #262626; border-radius: 20px; max-width: 480px; width: 100%; padding: 40px 32px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 800; color: #ffffff; margin-bottom: 8px; }
    p { font-size: 13px; color: #a3a3a3; line-height: 1.6; margin-bottom: 24px; }
    .task-box { background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.3); padding: 14px; border-radius: 12px; font-size: 12px; color: #34d399; font-weight: bold; margin-bottom: 24px; word-break: break-word; }
    .domain-tag { font-family: monospace; background: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); padding: 2px 8px; border-radius: 6px; }
    .btn { display: inline-block; padding: 12px 24px; background: #10b981; color: #052e16; font-weight: bold; border-radius: 12px; text-decoration: none; font-size: 13px; font-family: monospace; transition: all 0.2s; }
    .btn:hover { background: #34d399; transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛡️</div>
    <h1>NickOS Focus Guard Protection Active</h1>
    <p>
      Navigation to <span id="domainTag" class="domain-tag">this domain</span> was intercepted by NickOS Focus Guard matrix during active focus session.
    </p>

    <div class="task-box">
      🎯 Active Objective: <span id="activeTaskText">Loading session task...</span>
    </div>

    <a id="returnBtn" href="https://nickos.ai.studio" class="btn">Return to NickOS Cockpit</a>
  </div>

  <script src="blocked.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NickOS Focus Guard Diagnostics</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { width: 340px; background: #0a0a0a; color: #f5f5f5; padding: 16px; font-size: 12px; border: 1px solid #262626; border-radius: 12px; }
    .header { display: flex; align-items: center; justify-content: space-between; border-b: 1px solid #262626; padding-pb: 12px; margin-bottom: 14px; }
    .title { font-weight: 800; font-size: 14px; color: #10b981; display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 9px; padding: 2px 8px; border-radius: 99px; font-weight: bold; text-transform: uppercase; border: 1px solid #262626; }
    .badge.active { background: rgba(16, 185, 129, 0.15); color: #34d399; border-color: rgba(16, 185, 129, 0.4); }
    .badge.paused { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border-color: rgba(245, 158, 11, 0.4); }
    .card { background: #171717; border: 1px solid #262626; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .card-title { font-size: 10px; color: #a3a3a3; text-transform: uppercase; font-weight: bold; margin-bottom: 6px; letter-spacing: 0.5px; }
    .domain-box { font-size: 13px; font-weight: bold; color: #ffffff; word-break: break-all; margin-bottom: 4px; }
    .status-text { font-size: 11px; font-weight: bold; }
    .status-allowed { color: #34d399; }
    .status-blocked { color: #f87171; }
    .meta-row { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10px; color: #a3a3a3; }
    .btn { display: block; width: 100%; padding: 8px; border-radius: 8px; background: #10b981; color: #052e16; font-weight: font-bold; text-align: center; border: none; cursor: pointer; text-decoration: none; margin-top: 8px; font-size: 11px; }
    .btn:hover { background: #34d399; }
    .footer { font-size: 9px; color: #737373; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      🛡️ NickOS Guard
    </div>
    <span id="sessionStatusBadge" class="badge paused">Syncing...</span>
  </div>

  <div class="card">
    <div class="card-title">Active Focus Cockpit</div>
    <div id="activeTaskTitle" style="font-weight: bold; color: #f5f5f5; font-size: 12px;">No Active Session</div>
    <div className="meta-row" style="margin-top: 4px;">
      <span id="modeText">Mode: Blacklist</span>
      <span id="blockedCountText">0 Sites Blocked</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Current Domain Evaluation</div>
    <div id="currentDomainText" class="domain-box">detecting...</div>
    <div id="currentDomainStatus" class="status-text status-allowed">Evaluating...</div>
    <div id="ruleReasonText" style="font-size: 10px; color: #737373; margin-top: 4px;">Matched dynamic rule engine</div>
  </div>

  <button id="syncBtn" class="btn">Force Sync Matrix</button>
  <div class="footer">NickOS Focus Guard Manifest V3 Engine v1.0.0</div>

  <script src="popup.js"></script>
</body>
</html>
